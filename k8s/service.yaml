# NodePort fixa 30080: mesmo valor do target group/listener do orders no NLB
# interno (variavel `services` do mechanical-hub-infra). Mudar aqui exige mudar
# la junto.
apiVersion: v1
kind: Service
metadata:
  name: mechanical-hub-orders-svc
  namespace: production
  labels:
    app: mechanical-hub-orders
    app.kubernetes.io/name: orders
spec:
  type: NodePort
  selector:
    app: mechanical-hub-orders
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
