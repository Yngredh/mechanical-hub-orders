# Senha do usuario da aplicacao (orders_app). Vem do secret
# ORDERS_DB_APP_PASSWORD do repositorio, aplicado pelo pipeline via envsubst;
# o valor nunca fica versionado.
apiVersion: v1
kind: Secret
metadata:
  name: mechanical-hub-orders-secrets
  namespace: production
  labels:
    app: mechanical-hub-orders
    app.kubernetes.io/name: orders

type: Opaque
stringData:
  database-password: "${DB_PASSWORD}"
