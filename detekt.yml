# Sobrescreve apenas o necessario; o resto vem da configuracao padrao do detekt
# (buildUponDefaultConfig = true no pom.xml).
style:
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotation: true
  ThrowsCount:
    # Guard clauses de validacao (cliente, veiculo, dono do veiculo).
    max: 3
  ReturnCount:
    max: 3
  MaxLineLength:
    # Mesmo limite do ktlint (.editorconfig).
    maxLineLength: 140

performance:
  SpreadOperator:
    # runApplication(*args) e o ponto de entrada padrao do Spring Boot.
    excludes: ['**/*Application.kt']

complexity:
  TooManyFunctions:
    # O agregado ServiceOrder expoe um metodo por transicao de order_status.md.
    thresholdInClasses: 20
  LongParameterList:
    functionThreshold: 7
    # Entidades JPA espelham as colunas da tabela.
    excludes: ['**/persistence/entities/**']
